[package]
name = "canvas-notes"
version = "0.1.0"
description = "A free-canvas notes app that keeps everything on your computer"
authors = ["JJN8805"]
edition = "2021"
rust-version = "1.90"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "canvas_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-sql = { version = "2.5", features = ["sqlite"] }
tauri-plugin-fs = "2.6"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wi-Fi sync: encryption and a plain-HTTP client (no TLS needed: payloads are encrypted).
chacha20poly1305 = "0.10"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false }

# The sync service only runs on the laptop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tiny_http = "0.12"
local-ip-address = "0.6"

[profile.release]
# Smaller, faster release binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
